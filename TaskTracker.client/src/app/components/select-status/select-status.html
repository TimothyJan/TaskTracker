<mat-label>Status: </mat-label>
<mat-form-field>
  <mat-select
    (selectionChange)="onStatusChange($event)"
    [value]="selectedStatus"
    placeholder="Select Status">
    <mat-option *ngFor="let status of statuses" [value]="status">
      {{ status }}
    </mat-option>
  </mat-select>
</mat-form-field>
