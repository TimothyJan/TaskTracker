@if(!isLoading) {
  <mat-card appearance="outlined">

      <mat-grid-list cols="15" rowHeight="2em">
      <mat-grid-tile colspan="4">
        <div class="date">
          {{ projectTask.startDate | date: 'shortDate':'UTC' }} - {{ projectTask.dueDate | date: 'shortDate':'UTC' }}
        </div>
      </mat-grid-tile>
      <mat-grid-tile colspan="7"></mat-grid-tile>
      <mat-grid-tile colspan="3">
        <div class="status">
          {{ projectTask.status }}
        </div>
      </mat-grid-tile>
      <mat-grid-tile colspan="1">
        <button matIconButton [matMenuTriggerFor]="menu">
          <mat-icon>more_vert</mat-icon>
        </button>

        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="openProjectTaskEditDialog()">Edit</button>
          <button mat-menu-item (click)="onDelete()">Delete</button>
          <button mat-menu-item>Cancel</button>
        </mat-menu>
      </mat-grid-tile>
    </mat-grid-list>

    <mat-card-content>

      <mat-card-title>
        {{ projectTask.name }}
      </mat-card-title>

      <p>{{ projectTask.description }}</p>

      <app-assigned-emp [projectTaskId]="projectTaskId"></app-assigned-emp>

    </mat-card-content>

  </mat-card>
} @else {
  <mat-spinner></mat-spinner>
}
